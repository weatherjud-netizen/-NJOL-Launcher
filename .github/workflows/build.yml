name: Import Source Code from Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'тег релиза v1.0-debug'
        required: true
        type: string

jobs:
  import-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Source-Code.zip from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Скачиваем Source-Code.zip из релиза ${{ github.event.inputs.release_tag }}..."
          gh release download ${{ github.event.inputs.release_tag }} --pattern "Source-Code.zip"

      - name: Extract ZIP file
        run: |
          echo "Распаковываем архив..."
          unzip -o Source-Code.zip -d .
          rm Source-Code.zip
          echo "Архив распакован, исходный файл удален."

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Import source code from release Source-Code.zip"
          branch: main
