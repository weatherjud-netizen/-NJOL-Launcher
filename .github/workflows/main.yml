name: Import Source Code from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL to the ZIP file with source code'
        required: true
        type: string

jobs:
  import-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ZIP file
        run: |
          echo "Скачиваем архив..."
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          
          # Проверка, что скачался именно архив, а не HTML-страница
          if ! file source.zip | grep -q "Zip archive"; then
            echo "ОШИБКА: Скачанный файл не является ZIP-архивом. Возможно, ссылка требует авторизации."
            exit 1
          fi

      - name: Extract ZIP file
        run: |
          echo "Распаковываем архив..."
          unzip -o source.zip -d .
          rm source.zip
          
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Import source code from ZIP archive"
          branch: main
