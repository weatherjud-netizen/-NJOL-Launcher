name: NJOL build and test release

on:
  pull_request:
  push:
    tags:
      - 'debug-v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub prerelease from this commit'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: njol-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: 'platforms;android-37'
  BUILD_TOOLS: 'build-tools;37.0.0'
  NDK_VERSION: 'ndk;25.2.9519653'

jobs:
  build:
    name: Build NJOL Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:?ANDROID_HOME is required}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "$ANDROID_PLATFORM" \
            "$BUILD_TOOLS" \
            "$NDK_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 Debug APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :ZalithLauncher:testDebugUnitTest \
            :ZalithLauncher:assembleDebug \
            -Darch=arm64
          mkdir -p release-files
          APK="$(find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release-files/NJOL-debug-arm64.apk

      - name: Build universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :ZalithLauncher:assembleDebug \
            -Darch=all
          APK="$(find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release-files/NJOL-debug-universal.apk

      - name: Create exact source archive with license materials
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f LICENSE_RU.md
          test -f README.md
          test -f README_NJOL_RU.md
          test -f THIRD_PARTY_NOTICES_RU.md
          test -f RELEASE_RU.md
          TAG="${GITHUB_REF_NAME:-source-snapshot}"
          git archive --format=zip --prefix="NJOL-${TAG}/" \
            -o "release-files/NJOL-Source-${TAG}.zip" HEAD
          unzip -Z1 "release-files/NJOL-Source-${TAG}.zip" | grep -q 'LICENSE$'
          unzip -Z1 "release-files/NJOL-Source-${TAG}.zip" | grep -q 'THIRD_PARTY_NOTICES_RU.md$'

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-files && sha256sum *.apk *.zip) | tee release-files/NJOL-checksums.txt
          (cd release-files && sha256sum -c NJOL-checksums.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NJOL-${{ github.ref_name }}
          path: release-files/*
          if-no-files-found: error
          compression-level: 0

  publish-prerelease:
    name: Publish GitHub test prerelease
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/debug-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: NJOL-${{ github.ref_name }}
          path: release-files

      - name: Publish GPLv3-compliant test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NJOL ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## NapoleJavaON Launcher — тестовая Debug-сборка

            Это не production-релиз. APK подписаны Debug-ключом и предназначены для тестирования.

            В релиз приложены arm64 и universal APK, точный исходный ZIP этого commit/tag и SHA-256 checksums.

            NJOL — неофициальная изменённая версия GPLv3-проектов Zalith Launcher. Сохранены `LICENSE`, copyright-заголовки, third-party notices и upstream attribution. Проект не является официальным продуктом Zalith Launcher, Mojang, Microsoft или PojavLauncher.
          files: |
            release-files/*.apk
            release-files/*.zip
            release-files/NJOL-checksums.txt
