name: Replace repository root from release source

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example debug-v1-0.R2'
        required: true
        default: 'debug-v1.0.R2'
        type: string
      source_asset:
        description: 'Source ZIP asset name in that release'
        required: true
        default: 'NJOL-Source.zip'
        type: string
      confirmation:
        description: 'Type REPLACE_ROOT to confirm replacing the current branch root'
        required: true
        type: string

permissions:
  contents: write

jobs:
  replace-root:
    name: Replace root from release source archive
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check destructive-operation confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "REPLACE_ROOT" ]]; then
            echo '::error::Confirmation must be exactly REPLACE_ROOT.'
            exit 1
          fi

      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Download source archive from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/njol-source
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" \
            --dir /tmp/njol-source
          test -f "/tmp/njol-source/$SOURCE_ASSET"

      - name: Validate and extract archive safely
        shell: bash
        env:
          SOURCE_ASSET: ${{ inputs.source_asset }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archive = Path('/tmp/njol-source') / os.environ['SOURCE_ASSET']
          extracted = Path('/tmp/njol-extracted')
          extracted.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              if not names:
                  raise SystemExit('Source archive is empty')

              for name in names:
                  path = Path(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {name}')

              zf.extractall(extracted)

          entries = [p for p in extracted.iterdir()]
          if len(entries) == 1 and entries[0].is_dir():
              source_root = entries[0]
          else:
              source_root = extracted

          destination = Path('/tmp/njol-new-root')
          destination.mkdir(parents=True, exist_ok=True)
          for item in source_root.iterdir():
              target = destination / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)

          required = ['LICENSE', 'README.md']
          missing = [name for name in required if not (destination / name).exists()]
          if missing:
              raise SystemExit(f'Missing required source files: {missing}')

          print('Validated source archive:', archive)
          print('Prepared replacement root:', destination)
          PY

      - name: Create backup branch before replacing root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BACKUP_BRANCH="backup/pre-root-replace-${{ inputs.release_tag }}-${GITHUB_RUN_ID}"
          git switch -c "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"
          echo "BACKUP_BRANCH=$BACKUP_BRANCH" >> "$GITHUB_ENV"

      - name: Replace every tracked root file with release source
        shell: bash
        run: |
          set -euo pipefail

          # GitHub blocks the default GITHUB_TOKEN from changing workflow files.
          # Preserve the currently running Actions definitions and replace the
          # application source and project files from the release archive.
          mkdir -p /tmp/njol-preserved-workflows
          if [[ -d .github/workflows ]]; then
            cp -a .github/workflows/. /tmp/njol-preserved-workflows/
          fi

          # Delete the current working-tree contents except .git.
          # This does not rewrite history; the backup branch above preserves the old tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/njol-new-root/. .

          mkdir -p .github/workflows
          cp -a /tmp/njol-preserved-workflows/. .github/workflows/

          test -f LICENSE
          test -f README.md
          git add -A

      - name: Commit and push replaced repository root
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "release: replace repository root from ${{ inputs.release_tag }} source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "The root was replaced from release tag ${{ inputs.release_tag }}."
          echo "Backup branch: $BACKUP_BRANCH"
          
